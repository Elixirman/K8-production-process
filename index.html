<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kubernetes: Request to Runtime</title>
<style>
  :root{
    --bg: #0D1117;
    --panel: #141B24;
    --panel-2: #1C2531;
    --panel-3: #232E3D;
    --line: #2A3444;
    --line-soft: #1F2836;
    --text: #EEF1F5;
    --muted: #8D96A8;
    --teal: #52E3CC;
    --teal-dim: rgba(82,227,204,.14);
    --amber: #F5B26B;
    --amber-dim: rgba(245,178,107,.12);
    --mono: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns: 84px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- RAIL ---------- */
  .rail{
    background:linear-gradient(180deg, var(--panel), var(--bg));
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 0;
    gap:3px;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{ display:none; }
  .rail .brand{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--muted);
    writing-mode:vertical-rl;
    margin-bottom:26px;
    transform:rotate(180deg);
  }
  .rail .brand em{ color:var(--teal); font-style:normal; }
  .dot-btn{
    width:44px; height:44px;
    border-radius:9px;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:var(--mono);
    font-size:11.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    flex-shrink:0;
    transition:color .2s ease, background .2s ease, transform .2s ease;
  }
  .dot-btn:hover{ background:var(--panel-2); color:var(--text); transform:scale(1.05); }
  .dot-btn.active{
    background:var(--teal-dim);
    color:var(--teal);
    box-shadow:0 0 0 1px rgba(82,227,204,.35) inset;
  }
  .dot-btn.active::before{
    content:"";
    position:absolute;
    left:-15px;
    width:3px; height:22px;
    border-radius:2px;
    background:var(--teal);
    box-shadow:0 0 8px rgba(82,227,204,.7);
  }

  /* ---------- MAIN ---------- */
  .stage{ position:relative; overflow:hidden; height:100vh; }
  .slide{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns: 0.92fr 1.3fr;
    opacity:0;
    pointer-events:none;
    transform:translateY(18px) scale(.99);
    transition:opacity .5s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1);
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }

  .copy{
    padding:60px 52px 90px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:600px;
    position:relative;
  }
  .kicker{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.03em;
    color:var(--amber);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .kicker::before{
    content:"";
    width:22px; height:1px;
    background:var(--amber);
    display:inline-block;
  }
  h1{
    font-size:42px;
    line-height:1.1;
    font-weight:680;
    letter-spacing:-0.015em;
    margin-bottom:20px;
  }
  .lede{
    color:var(--muted);
    font-size:16.5px;
    line-height:1.6;
    margin-bottom:28px;
    max-width:48ch;
  }
  ul.points{ list-style:none; display:flex; flex-direction:column; gap:13px; }
  ul.points li{
    font-size:15px;
    line-height:1.55;
    color:var(--text);
    padding-left:20px;
    position:relative;
  }
  ul.points li::before{
    content:"";
    position:absolute;
    left:0; top:8px;
    width:7px; height:7px;
    border-radius:1.5px;
    background:var(--teal);
  }
  ul.points li b{ color:var(--teal); font-weight:650; }
  ul.points li.warn::before{ background:var(--amber); }
  ul.points li.warn b{ color:var(--amber); }

  .diagram-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px;
    background:
      radial-gradient(circle at 75% 20%, rgba(82,227,204,.08), transparent 50%),
      var(--panel);
    border-left:1px solid var(--line);
    overflow:hidden;
  }
  .diagram-wrap::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
    opacity:.35;
    mask-image:radial-gradient(circle at 60% 40%, black 0%, transparent 75%);
  }
  .diagram-wrap svg{
    position:relative;
    width:100%;
    height:100%;
    max-height:none;
  }

  /* svg helpers */
  .box{ fill:var(--panel-3); stroke:var(--line); stroke-width:1.4; }
  .box-hi{ stroke:var(--teal); stroke-width:1.8; filter:drop-shadow(0 0 10px rgba(82,227,204,.25)); }
  .box-warn{ stroke:var(--amber); stroke-width:1.8; filter:drop-shadow(0 0 10px rgba(245,178,107,.22)); }
  .lbl{ fill:var(--text); font-family:var(--sans); font-size:16px; font-weight:650; }
  .sub{ fill:var(--muted); font-family:var(--mono); font-size:12px; }
  .flow{ fill:none; stroke:var(--teal); stroke-width:2.2; stroke-linecap:round; }
  .flow-amber{ stroke:var(--amber); }
  .pulse{ fill:var(--teal); }

  #dg-wrap g[id^="dg-"]{
    transform-box: view-box;
    transform-origin: center;
  }

  .anim-in{ opacity:0; transform:scale(.9); transform-origin:center; animation:popIn .55s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes popIn{ to{ opacity:1; transform:scale(1); } }
  .draw{ stroke-dasharray:500; stroke-dashoffset:500; animation:draw 1s ease forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* ---------- NAV ---------- */
  .navbar{
    position:absolute;
    bottom:30px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    background:rgba(20,27,36,.92);
    backdrop-filter:blur(8px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 12px;
    z-index:20;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .navbar button{
    width:38px; height:38px;
    border-radius:999px;
    border:none;
    background:var(--panel-3);
    color:var(--text);
    cursor:pointer;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, transform .15s ease;
  }
  .navbar button:hover:not(:disabled){ background:var(--teal-dim); color:var(--teal); transform:scale(1.06); }
  .navbar button:disabled{ opacity:.3; cursor:default; }
  .counter{ font-family:var(--mono); font-size:12.5px; color:var(--muted); min-width:58px; text-align:center; letter-spacing:.03em; }

  .progress{
    position:absolute; top:0; left:84px; right:0; height:3px;
    background:var(--line-soft);
    z-index:15;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--teal), var(--amber));
    transition:width .5s cubic-bezier(.2,.7,.2,1);
  }

  @media (max-width: 900px){
    .app{ grid-template-columns:1fr; grid-template-rows:56px 1fr; }
    .rail{ flex-direction:row; border-right:none; border-bottom:1px solid var(--line); padding:0 12px; overflow-x:auto; overflow-y:hidden; }
    .rail .brand{ display:none; }
    .dot-btn.active::before{ display:none; }
    .progress{ left:0; }
    .slide{ grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow-y:auto; }
    .copy{ padding:24px 22px 8px; max-width:100%; }
    h1{ font-size:28px; }
    .lede{ font-size:15px; }
    .diagram-wrap{ border-left:none; border-top:1px solid var(--line); padding:18px; min-height:280px; }
  }
</style>
</head>
<body>

<div class="progress"><div class="progress-fill" id="progressFill"></div></div>
<div class="app">
  <nav class="rail" id="rail"><div class="brand">K8s <em>&#9679;</em> FLOW</div></nav>
  <div class="stage" id="stage"></div>
</div>

<div class="navbar">
  <button id="prevBtn" aria-label="Previous">&#8592;</button>
  <span class="counter" id="counter">01 / 11</span>
  <button id="nextBtn" aria-label="Next">&#8594;</button>
</div>

<script>
/* ---------------------------------------------------------
   CONTENT MODEL — 11 stages, no fluff, correct terminology
   viewBox: 0 0 900 540 for every diagram (larger canvas)
--------------------------------------------------------- */
const VB_W = 900, VB_H = 540;

const stages = [

{
  id:"intro",
  kicker:"00 / START",
  title:"What actually happens\nwhen you deploy an app",
  lede:"Kubernetes turns a YAML file into a running, self-healing, scalable service. This walkthrough follows one request through every real layer of that system — the ones tutorials usually skip too.",
  points:[
    "Each section is one <b>architectural layer</b>, in the order a deployment actually flows through them",
    "Built for both <b>learning the system</b> and as a <b>production checklist</b> — nothing simplified to the point of being wrong"
  ],
  diagram:(g)=>{
    g(`
      <g class="anim-in" style="animation-delay:.05s">
        <rect class="box" x="50" y="230" width="220" height="90" rx="10"/>
        <text class="lbl" x="160" y="270" text-anchor="middle">Developer</text>
        <text class="sub" x="160" y="295" text-anchor="middle">git commit</text>
      </g>
      <path class="flow draw" style="animation-delay:.35s" d="M270,275 H 440" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:.55s">
        <rect class="box box-hi" x="440" y="220" width="250" height="110" rx="10"/>
        <text class="lbl" x="565" y="268" text-anchor="middle">Kubernetes</text>
        <text class="sub" x="565" y="294" text-anchor="middle">11-layer system</text>
      </g>
      <path class="flow draw" style="animation-delay:.85s" d="M690,275 H 830" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:1.1s">
        <rect class="box" x="700" y="380" width="0" height="0"/>
      </g>
      <g class="anim-in" style="animation-delay:1.1s">
        <text class="sub" x="565" y="380" text-anchor="middle" font-size="13">API Server → etcd → Scheduler → Kubelet → Service → Pod</text>
      </g>
      <g class="anim-in" style="animation-delay:1.3s">
        <rect class="box" x="770" y="230" width="0" height="0"/>
      </g>
    `);
  }
},

{
  id:"control-plane",
  kicker:"01 / CLUSTER BRAIN",
  title:"Control Plane",
  lede:"Every request — kubectl, ArgoCD, a controller — passes through here first. Runs on 3 or 5 master nodes in production (always odd, for quorum).",
  points:[
    "<b>API Server</b> — front door; authenticates, validates, and admits every request",
    "<b>etcd</b> — distributed key-value store; the single source of truth. Needs (N/2)+1 nodes healthy",
    "<b>Scheduler</b> — assigns unscheduled Pods to nodes by resources, affinity, taints",
    "<b>Controller Manager</b> — reconciliation loops that push actual state → desired state",
    "<b>Admission Controllers</b> (OPA/Gatekeeper, Kyverno, Pod Security Admission) — policy checks before anything is persisted"
  ],
  diagram:(g)=>{
    g(`
      <g class="anim-in" style="animation-delay:.05s">
        <rect class="box box-hi" x="70" y="50" width="760" height="100" rx="10"/>
        <text class="lbl" x="100" y="95" font-size="19">API Server</text>
        <text class="sub" x="100" y="120">validates · authenticates · admits</text>
      </g>
      <path class="flow draw" style="animation-delay:.35s" d="M450,150 V 200" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:.55s">
        <rect class="box box-warn" x="270" y="200" width="360" height="66" rx="10"/>
        <text class="lbl" x="450" y="240" text-anchor="middle">Admission Controllers</text>
      </g>
      <path class="flow draw" style="animation-delay:.85s" d="M450,266 V 320" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:1.05s">
        <rect class="box" x="70" y="320" width="230" height="90" rx="10"/>
        <text class="lbl" x="185" y="360" text-anchor="middle">etcd</text>
        <text class="sub" x="185" y="384" text-anchor="middle">source of truth</text>
      </g>
      <g class="anim-in" style="animation-delay:1.2s">
        <rect class="box" x="335" y="320" width="230" height="90" rx="10"/>
        <text class="lbl" x="450" y="360" text-anchor="middle">Scheduler</text>
        <text class="sub" x="450" y="384" text-anchor="middle">assigns pods → nodes</text>
      </g>
      <g class="anim-in" style="animation-delay:1.35s">
        <rect class="box" x="600" y="320" width="230" height="90" rx="10"/>
        <text class="lbl" x="715" y="360" text-anchor="middle">Controller Mgr</text>
        <text class="sub" x="715" y="384" text-anchor="middle">reconciliation loops</text>
      </g>
    `);
  }
},

{
  id:"worker-nodes",
  kicker:"02 / WHERE WORKLOADS RUN",
  title:"Worker Nodes & Workloads",
  lede:"kubelet talks to the API server and runs containers per the PodSpec. Not everything is a Deployment.",
  points:[
    "<b>kubelet</b> — node agent, starts/stops containers, reports health",
    "<b>Container runtime (CRI)</b> — containerd or CRI-O",
    "<b>kube-proxy</b> — programs iptables/IPVS for Service traffic",
    "<b>Deployment</b> stateless · <b>StatefulSet</b> stateful (DBs) · <b>DaemonSet</b> one-per-node · <b>Job/CronJob</b> batch",
    "Real HA needs <b class='warn2'>Taints/Tolerations, Affinity rules, PodDisruptionBudgets</b> — not just replica count"
  ],
  diagram:(g)=>{
    g(`
      <g class="anim-in" style="animation-delay:.05s">
        <rect class="box box-hi" x="50" y="40" width="800" height="64" rx="10"/>
        <text class="lbl" x="80" y="80" font-size="18">Node</text>
        <text class="sub" x="770" y="80" text-anchor="end">kubelet · kube-proxy · CRI</text>
      </g>
      ${["Deployment","StatefulSet","DaemonSet","Job / CronJob"].map((n,i)=>`
      <g class="anim-in" style="animation-delay:${.3+i*.14}s">
        <rect class="box" x="${50+i*200}" y="150" width="180" height="120" rx="10"/>
        <text class="lbl" x="${140+i*200}" y="205" text-anchor="middle" font-size="15">${n}</text>
        <circle class="pulse" cx="${140+i*200}" cy="238" r="6"/>
      </g>`).join("")}
      <path class="flow draw" style="animation-delay:1s" d="M450,104 V 150" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:1.2s">
        <rect class="box box-warn" x="50" y="320" width="800" height="80" rx="10"/>
        <text class="lbl" x="450" y="368" text-anchor="middle" font-size="16">Taints · Affinity · PodDisruptionBudgets</text>
      </g>
    `);
  }
},

{
  id:"networking",
  kicker:"03 / TRAFFIC",
  title:"Networking, Ingress & Mesh",
  lede:"Pod networking, service discovery, and how traffic actually gets from the internet to a container.",
  points:[
    "<b>CNI plugin</b> (Calico, Cilium, VPC-CNI) — provides pod networking + enforces NetworkPolicy. Not built-in — you choose one",
    "<b>Service</b> — stable virtual IP/DNS name for a set of Pods",
    "<b>Ingress Controller / Gateway API</b> — routes external HTTPS traffic in",
    "<b>cert-manager</b> — auto-issues and renews TLS certs",
    "<b>Service Mesh</b> (Istio/Linkerd) — mTLS, retries, canary traffic — optional, adds real overhead",
    "<b>CoreDNS</b> — resolves service.namespace.svc.cluster.local"
  ],
  diagram:(g)=>{
    g(`
      <g class="anim-in" style="animation-delay:.05s">
        <rect class="box" x="40" y="170" width="140" height="80" rx="10"/>
        <text class="lbl" x="110" y="217" text-anchor="middle">Internet</text>
      </g>
      <path class="flow draw" style="animation-delay:.3s" d="M180,210 H 300" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:.5s">
        <rect class="box box-hi" x="300" y="150" width="220" height="120" rx="10"/>
        <text class="lbl" x="410" y="205" text-anchor="middle">Ingress / Gateway</text>
        <text class="sub" x="410" y="230" text-anchor="middle">+ cert-manager TLS</text>
      </g>
      <path class="flow draw" style="animation-delay:.8s" d="M520,210 H 630" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:1s">
        <rect class="box" x="630" y="160" width="160" height="100" rx="10"/>
        <text class="lbl" x="710" y="205" text-anchor="middle">Service</text>
        <text class="sub" x="710" y="230" text-anchor="middle">ClusterIP</text>
      </g>
      <path class="flow draw" style="animation-delay:1.25s" d="M710,260 V 300" marker-end="url(#arrow)"/>
      <g class="anim-in" style="animation-delay:1.45s">
        <circle class="box" cx="710" cy="345" r="44"/>
        <text class="sub" x="710" y="350" text-anchor="middle">Pod</text>
      </g>
      <g class="anim-in" style="animation-delay:1.6s">
        <rect class="box box-warn" x="280" y="330" width="260" height="70" rx="10"/>
        <text class="lbl" x="410" y="372" text-anchor="middle" font-size="15">CNI (Calico / Cilium)</text>
      </g>
      <g class="anim-in" style="animation-delay:1.75s">
        <rect class="box" x="580" y="330" width="200" height="70" rx="10"/>
        <text class="lbl" x="680" y="372" text-anchor="middle" font-size="15">CoreDNS</text>
      </g>
    `);
  }
},

{
  id:"storage",
  kicker:"04 / DATA",
  title:"Storage",
  lede:"How a Pod gets a durable, provider-backed disk attached to it.",
  points:[
    "<b>StorageClass</b> — template defining how storage gets dynamically provisioned",
    "<b>CSI Driver</b> — the actual plugin (EBS CSI, Azure Disk, Ceph) that talks to the backend",
    "<b>PersistentVolume / PersistentVolumeClaim</b> — PV is the real storage, PVC is the Pod's request for it",
    "<b>VolumeSnapshot</b> — point-in-time snapshot used for backup/restore"
  ],
  diagram:(g)=>{
    g(`
      ${["StorageClass","CSI Driver","PersistentVolume","PVC → Pod"].map((n,i)=>`
      <g class="anim-in" style="animation-delay:${.12+i*.2}s">
        <rect class="box ${i===2?'box-hi':''}" x="90" y="${40+i*115}" width="720" height="80" rx="10"/>
        <text class="lbl" x="120" y="${88+i*115}" font-size="17">${n}</text>
      </g>`).join("")}
      ${[0,1,2].map(i=>`<path class="flow draw" style="animation-delay:${.35+i*.2}s" d="M450,${120+i*115} V ${155+i*115}" marker-end="url(#arrow)"/>`).join("")}
    `);
  }
},

{
  id:"cicd",
  kicker:"05 / DELIVERY",
  title:"GitOps & CI/CD Pipeline",
  lede:"The promotion path from a commit to running pods — not just \"kubectl apply.\"",
  points:[
    "CI: build → test → build image → <b class='warn2'>scan image</b> (Trivy/Grype) → push to registry",
    "CD: update image tag in <b>GitOps repo</b> (Helm / Kustomize)",
    "<b>ArgoCD / Flux</b> detects drift, syncs desired state into the cluster",
    "<b>Progressive delivery</b> (Argo Rollouts, Flagger) — canary or blue-green, not straight to 100% traffic"
  ],
  diagram:(g)=>{
    const steps=["Commit","Build +\nScan","Registry","GitOps\nRepo","ArgoCD\nSync","Canary\n→ 100%"];
    g(`
      ${steps.map((s,i)=>`
      <g class="anim-in" style="animation-delay:${.12+i*.16}s">
        <rect class="box ${i===1?'box-warn':(i===4?'box-hi':'')}" x="${40+i*140}" y="220" width="120" height="100" rx="10"/>
        ${s.split("\\n").map((line,j)=>`<text class="lbl" x="${100+i*140}" y="${262+j*22}" text-anchor="middle" font-size="14.5">${line}</text>`).join("")}
      </g>`).join("")}
      ${steps.slice(0,-1).map((s,i)=>`<path class="flow draw" style="animation-delay:${.3+i*.16}s" d="M${160+i*140},270 H ${180+i*140}" marker-end="url(#arrow)"/>`).join("")}
    `);
  }
},

{
  id:"autoscale",
  kicker:"06 / ELASTICITY",
  title:"Autoscaling",
  lede:"Four different scalers, each solving a different problem — not just HPA.",
  points:[
    "<b>HPA</b> — scales pod replica count on CPU/memory or custom metrics",
    "<b>VPA</b> — right-sizes a pod's own CPU/memory requests over time",
    "<b>Cluster Autoscaler</b> — adds/removes nodes based on unschedulable pods",
    "<b>KEDA</b> — event-driven scaling (queue depth, Kafka lag, cron) for async workloads"
  ],
  diagram:(g)=>{
    const bars=[{l:"HPA",h:110},{l:"VPA",h:180},{l:"Cluster\nAutoscaler",h:250},{l:"KEDA",h:150}];
    g(`
      <line x1="80" y1="420" x2="820" y2="420" stroke="var(--line)" stroke-width="1.5"/>
      ${bars.map((b,i)=>`
        <rect class="box box-hi anim-in" style="animation-delay:${.18+i*.16}s" x="${150+i*170}" y="${420-b.h}" width="120" height="${b.h}" rx="8"/>
        ${b.l.split("\\n").map((line,j)=>`<text class="lbl" x="${210+i*170}" y="${450+j*20}" text-anchor="middle" font-size="14.5">${line}</text>`).join("")}
      `).join("")}
    `);
  }
},

{
  id:"security",
  kicker:"07 / GOVERNANCE",
  title:"Security & Governance",

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
const stageEl = document.getElementById('stage');
const railEl = document.getElementById('rail');
const counterEl = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
let current = 0;

stages.forEach((s,i)=>{
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.id = 'slide-'+i;

  const copy = document.createElement('div');
  copy.className = 'copy';
  copy.innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h1>${s.title.replace(/\n/g,'<br>')}</h1>
    <p class="lede">${s.lede}</p>
    <ul class="points">${s.points.map(p=>`<li class="${p.includes("warn2")?'warn':''}">${p.replace(/class='warn2'/g,"")}</li>`).join('')}</ul>
  `;

  const dwrap = document.createElement('div');
  dwrap.className = 'diagram-wrap';
  const svgHolder = document.createElement('div');
  svgHolder.id = 'dg-wrap';
  svgHolder.style.width='100%'; svgHolder.style.height='100%';
  svgHolder.innerHTML = `<svg viewBox="0 0 ${VB_W} ${VB_H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
        <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--teal)"/>
      </marker>
    </defs>
    <g id="dg-${i}"></g>
  </svg>`;
  dwrap.appendChild(svgHolder);

  slide.appendChild(copy);
  slide.appendChild(dwrap);
  stageEl.appendChild(slide);

  slide._build = () => {
    const target = svgHolder.querySelector('#dg-'+i);
    s.diagram((html)=>{ target.innerHTML = html; });
  };

  const dotBtn = document.createElement('button');
  dotBtn.className = 'dot-btn';
  dotBtn.textContent = String(i).padStart(2,'0');
  dotBtn.title = s.title.replace(/\n/g,' ');
  dotBtn.addEventListener('click', ()=>goTo(i));
  railEl.appendChild(dotBtn);
});

function goTo(i){
  if(i<0 || i>=stages.length) return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot-btn').forEach(b=>b.classList.remove('active'));
  const slide = document.getElementById('slide-'+i);
  slide.classList.add('active');
  document.querySelectorAll('.dot-btn')[i].classList.add('active');
  slide._build();
  current = i;
  counterEl.textContent = String(i+1).padStart(2,'0') + ' / ' + String(stages.length).padStart(2,'0');
  document.getElementById('prevBtn').disabled = i===0;
  document.getElementById('nextBtn').disabled = i===stages.length-1;
  progressFill.style.width = (((i+1)/stages.length)*100) + '%';
}

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});

goTo(0);
</script>
