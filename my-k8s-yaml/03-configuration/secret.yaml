# Sensitive values, injected the same way as the ConfigMap.
# stringData is plaintext here for readability — Kubernetes stores it as
# base64 in etcd, which is NOT encryption. Never commit real secrets like
# this to Git; use Vault or External Secrets Operator in production
# (see the "Security & Governance" section of the architecture walkthrough).
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
  namespace: my-app
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
